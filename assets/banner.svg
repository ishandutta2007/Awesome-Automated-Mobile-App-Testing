<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="pillGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="pillGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.1" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.4" />
    </pattern>

    <!-- Filter for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #94a3b8;
    }
    .tagline-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 15px;
      fill: #38bdf8;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .pill-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #e2e8f0;
    }

    /* Ambient Dynamic Animations */
    @keyframes pulseGlow1 {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(30px, 20px); opacity: 0.6; }
    }
    @keyframes pulseGlow2 {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.25; }
      50% { transform: scale(1.2) translate(-25px, -15px); opacity: 0.55; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes streamFlow {
      0% { stroke-dashoffset: 120; }
      100% { stroke-dashoffset: 0; }
    }

    .dynamic-orb-1 {
      animation: pulseGlow1 8s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .dynamic-orb-2 {
      animation: pulseGlow2 10s ease-in-out infinite;
      transform-origin: 1000px 300px;
    }
    .floating-card-1 {
      animation: floatPill 6s ease-in-out infinite;
    }
    .floating-card-2 {
      animation: floatPill 7s ease-in-out infinite 1s;
    }
    .floating-card-3 {
      animation: floatPill 5.5s ease-in-out infinite 2s;
    }
    .flow-line {
      stroke-dasharray: 8 6;
      animation: streamFlow 4s linear infinite;
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Ambient Dynamic Glowing Orbs in Background (Never covers foreground) -->
  <g filter="url(#glow)">
    <circle class="dynamic-orb-1" cx="180" cy="90" r="140" fill="#38bdf8" />
    <circle class="dynamic-orb-2" cx="1020" cy="330" r="160" fill="#818cf8" />
    <circle cx="600" cy="210" r="180" fill="#6366f1" opacity="0.12" />
  </g>

  <!-- Flowing Dynamic Data Streams in Background -->
  <path class="flow-line" d="M 50 360 C 350 360, 450 310, 750 310 C 950 310, 1050 360, 1150 360" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.25" />
  <path class="flow-line" d="M 50 60 C 250 60, 350 110, 650 110 C 850 110, 950 60, 1150 60" fill="none" stroke="#a855f7" stroke-width="1.8" opacity="0.2" />

  <!-- Center Content Card (Backdrop for contrast) -->
  <rect x="60" y="40" width="1080" height="340" rx="24" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Tagline / Eyebrow -->
  <text x="100" y="95" class="tagline-text">📱 Curated Ecosystem &amp; Quality Engineering Matrix</text>

  <!-- Main Title with Gradient fill -->
  <text x="100" y="155" class="title-text">Awesome Automated Mobile App Testing</text>

  <!-- Subtitle -->
  <text x="100" y="200" class="subtitle-text">
    Cloud device labs, continuous testing infrastructure, runners &amp; native frameworks for Android &amp; iOS
  </text>

  <!-- Dynamic Feature Badges & Pills (Positioned in lower row) -->
  <g class="floating-card-1">
    <rect x="100" y="245" width="220" height="52" rx="14" fill="url(#pillGrad1)" stroke="#0ea5e9" stroke-width="1.5" />
    <circle cx="125" cy="271" r="7" fill="#38bdf8" />
    <text x="145" y="277" class="pill-label">☁️ Real Device Clouds</text>
  </g>

  <g class="floating-card-2">
    <rect x="340" y="245" width="230" height="52" rx="14" fill="url(#pillGrad2)" stroke="#8b5cf6" stroke-width="1.5" />
    <circle cx="365" cy="271" r="7" fill="#c084fc" />
    <text x="385" y="277" class="pill-label">⚡ Open-Source Runners</text>
  </g>

  <g class="floating-card-3">
    <rect x="590" y="245" width="245" height="52" rx="14" fill="url(#pillGrad3)" stroke="#10b981" stroke-width="1.5" />
    <circle cx="615" cy="271" r="7" fill="#34d399" />
    <text x="635" y="277" class="pill-label">📊 Benchmarks &amp; Pricing</text>
  </g>

  <!-- Status Indicator in Foreground Top-Right -->
  <rect x="915" y="75" width="185" height="36" rx="18" fill="#0f172a" stroke="#22c55e" stroke-width="1.2" />
  <circle cx="935" cy="93" r="5" fill="#22c55e" />
  <text x="950" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#86efac">CONTINUOUS TESTING</text>
</svg>
